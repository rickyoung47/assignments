<!doctype html>
<html lang="en">
  <head>
    <!--
      `charset` lets browsers interpret the text consistently, and `viewport`
      makes the layout use the device's actual screen width on phones.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Hello World page for Younghun Kim."
    />
    <title>Hello World!</title>

    <!--
      This is a static stylesheet stored alongside this HTML file. A relative
      path works both locally and after Cloudflare Pages publishes the site.
    -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      `main` identifies the page's primary content for assistive technology.
      The `hero` class is used only for presentation in styles.css.
    -->
    <main class="hero">
      <section class="message" aria-labelledby="page-title">
        <!-- The requested page title. Keep this as one h1 for clear structure. -->
        <h1 id="page-title">Hello World!</h1>

        <!-- The requested introductory text. -->
        <p>I'm Younghun Kim</p>
      </section>
    </main>
  </body>
</html>
