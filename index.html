<!doctype html>
<html lang="en">
  <head>
    <!--
      `charset` lets the browser correctly display text from many languages.
      `viewport` makes the layout use the device width on phones and tablets.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Hello World page for Jae Seung Lee."
    />
    <title>Hello World!</title>

    <!--
      All visual styling lives in a separate file. Keeping structure (HTML)
      and presentation (CSS) separate makes future edits straightforward.
    -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      `main` identifies the page's primary content for assistive technology.
      This is the only application content, so no JavaScript is required.
    -->
    <main class="welcome-card">
      <!-- The requested page title. Change this text to update the greeting. -->
      <h1>Hello World!</h1>

      <!-- The requested introduction text. -->
      <p>I'm Jae Seung Lee</p>
    </main>
  </body>
</html>
